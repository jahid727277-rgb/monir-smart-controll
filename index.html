<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>সেনসোটিক ⏰ ঘন্টা</title>
<style>
/* Reset and Base Styles */
* { 
    margin:0; 
    padding:0; 
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}
input, textarea {
    -webkit-user-select: text;
    -moz-user-select: text;
    -ms-user-select: text;
    user-select: text;
}
body { 
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    background:#000; 
    padding:20px; 
    min-height:100vh; 
    display: flex;
    flex-direction: column;
}
.container { max-width:600px; margin:0 auto; width: 100%; }
.header { text-align:center; color:#fff; margin-bottom:30px; padding-bottom:20px; border-bottom:2px solid #fff; }
.header h1 { font-size:28px; margin-bottom:5px; font-weight:600; }

/* Alarm List and Items */
.alarm-list { 
    background:#000; 
    border-radius:15px; 
    padding:15px; 
    box-shadow:0 2px 10px rgba(255,255,255,0.1); 
    margin-bottom:80px; 
    min-height:200px; 
    border:1px solid #fff; 
}
.alarm-item { 
    background:#000; 
    border-radius:15px; 
    padding:20px; 
    margin-bottom:15px; 
    display:flex; 
    justify-content:space-between; 
    align-items:center; 
    transition:all 0.3s ease; 
    border:2px solid #fff; 
}
.alarm-item:last-child { margin-bottom: 0; }
.alarm-item:hover { transform:translateY(-2px); box-shadow:0 5px 15px rgba(255,255,255,0.2); }
.alarm-item.active { border-color:#fff; background:#000; }

.alarm-info { flex:1; }
.alarm-time { font-size:36px; font-weight:bold; color:#fff; margin-bottom:8px; }
.alarm-days { font-size:14px; color:#fff; margin-bottom:5px; }
.alarm-label { font-size:12px; color:#fff; }
.alarm-duration { font-size:11px; color:#fff; opacity:0.8; margin-top:3px; }
.alarm-controls { display:flex; gap:10px; align-items:center; }

/* Toggle Switch */
.toggle-switch { 
    position:relative; 
    width:50px; 
    height:26px; 
    background:#fff; 
    border-radius:13px; 
    cursor:pointer; 
    transition:background 0.3s;
    outline: none;
}
.toggle-switch.active { background:#fff; }
.toggle-switch::after { content:''; position:absolute; width:22px; height:22px; background:#000; border-radius:50%; top:2px; left:2px; transition:left 0.3s; }
.toggle-switch.active::after { left:26px; background:#000; }

/* Edit Button */
.edit-btn { 
    background:#000; 
    color:#fff; 
    border:2px solid #fff; 
    width:36px; 
    height:36px; 
    border-radius:8px; 
    cursor:pointer; 
    font-size:16px; 
    transition:all 0.3s; 
    display: flex; 
    align-items: center; 
    justify-content: center;
    position: relative;
    overflow: hidden;
    outline: none;
}
.edit-btn:hover { 
    background:#fff; 
    color:#000;
    transform:scale(1.05); 
}
.edit-btn::before {
    content: '✎';
    font-size: 18px;
    font-weight: bold;
    line-height: 1;
}

/* Delete Button */
.delete-btn { 
    background:#000; 
    color:#fff; 
    border:2px solid #fff; 
    width:36px; 
    height:36px; 
    border-radius:8px; 
    cursor:pointer; 
    font-size:18px; 
    transition:all 0.3s; 
    display: flex; 
    align-items: center; 
    justify-content: center;
    position: relative;
    overflow: hidden;
    outline: none;
}
.delete-btn:hover { 
    background:#fff; 
    color:#000;
    transform:scale(1.05) rotate(5deg); 
}
.delete-btn::before {
    content: '×';
    font-size: 28px;
    font-weight: bold;
    line-height: 1;
}

/* Add Button (Fixed) */
.add-button { 
    position:fixed; 
    bottom:30px; 
    right:30px; 
    width:60px; 
    height:60px; 
    background:#fff; 
    border-radius:50%; 
    border:none; 
    color:#000; 
    font-size:32px; 
    cursor:pointer; 
    box-shadow:0 4px 15px rgba(255,255,255,0.3); 
    transition:all 0.3s; 
    z-index:1000; 
    display: flex;
    align-items: center;
    justify-content: center;
    outline: none;
}
.add-button:hover { transform:scale(1.1); box-shadow:0 6px 20px rgba(255,255,255,0.5); }

/* Modal Styles */
.modal { 
    display:none; 
    position:fixed; 
    top:0; left:0; right:0; bottom:0; 
    background:rgba(255,255,255,0.2); 
    z-index:2000; 
    padding:20px; 
    overflow-y:auto; 
}
.modal.show { display:flex; align-items:center; justify-content:center; }
.modal-content { 
    background:#000; 
    border-radius:20px; 
    padding:30px; 
    max-width:500px; 
    width:100%; 
    max-height:90vh; 
    overflow-y:auto; 
    border:2px solid #fff;
}
.modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; }
.modal-header h2 { font-size:24px; color:#fff; }
.close-btn { 
    background:none; 
    border:none; 
    font-size:28px; 
    cursor:pointer; 
    color:#fff;
    outline: none;
}

/* Form Elements */
.form-group { margin-bottom:20px; }
.form-group label { display:block; margin-bottom:8px; font-weight:600; color:#fff; }

.time-container { display:flex; gap:5px; align-items:center; justify-content:center; }
.time-input { 
    width:60px; 
    padding:10px; 
    border:2px solid #fff; 
    border-radius:8px; 
    font-size:20px; 
    text-align:center; 
    color:#fff; 
    font-weight:bold; 
    background:#000;
    outline: none;
}
.time-input::placeholder {
    color:#fff;
    opacity:0.6;
}
.time-input:focus { outline:none; border-color:#fff; }
.ampm-select { 
    width:70px; 
    padding:10px; 
    border:2px solid #fff; 
    border-radius:8px; 
    font-size:18px; 
    font-weight:bold; 
    cursor:pointer; 
    background:#000;
    color:#fff;
    outline: none;
}

/* Duration Input */
.duration-container { display:flex; gap:10px; align-items:center; justify-content:center; }
.duration-input { 
    width:80px; 
    padding:10px; 
    border:2px solid #fff; 
    border-radius:8px; 
    font-size:18px; 
    text-align:center; 
    color:#fff; 
    font-weight:bold; 
    background:#000;
    outline: none;
}
.duration-input::placeholder {
    color:#fff;
    opacity:0.6;
}
.duration-input:focus { outline:none; border-color:#fff; }
.duration-label { color:#fff; font-size:16px; font-weight:600; }

#alarmLabel { 
    width:100%; 
    padding:10px; 
    border:2px solid #fff; 
    border-radius:8px; 
    font-size:16px; 
    color:#fff; 
    font-weight:500; 
    background:#000;
    outline: none;
}
#alarmLabel::placeholder {
    color:#fff;
    opacity:0.6;
}
#alarmLabel:focus { outline:none; border-color:#fff; }

.days-selector { 
    display:grid; 
    grid-template-columns:repeat(7,1fr); 
    gap:8px; 
    justify-items:start;
}
.day-btn { 
    padding:12px 8px; 
    border:2px solid #fff; 
    background:#000; 
    border-radius:10px; 
    cursor:pointer; 
    font-size:12px; 
    font-weight:600; 
    color:#fff; 
    transition:all 0.3s; 
    width:100%;
    outline: none;
}
.day-btn.selected { background:#fff; color:#000; border-color:#fff; }

.save-btn { 
    width:100%; 
    padding:15px; 
    background:#fff; 
    color:#000; 
    border:none; 
    border-radius:10px; 
    font-size:16px; 
    font-weight:600; 
    cursor:pointer; 
    margin-top:20px; 
    transition:all 0.3s;
    outline: none;
}
.save-btn:hover { transform:translateY(-2px); box-shadow:0 5px 20px rgba(255,255,255,0.3); }

/* Delete Button in Modal */
.delete-alarm-btn {
    width:100%; 
    padding:15px; 
    background:#000; 
    color:#fff; 
    border:2px solid #fff; 
    border-radius:10px; 
    font-size:16px; 
    font-weight:600; 
    cursor:pointer; 
    margin-top:10px; 
    transition:all 0.3s;
    outline: none;
}
.delete-alarm-btn:hover { 
    background:#fff; 
    color:#000;
    transform:translateY(-2px); 
}

/* Empty State */
.empty-state { text-align:center; padding:40px 20px; color:#fff; }
.empty-state svg { width:80px; height:80px; margin-bottom:15px; opacity:0.5; }

/* Loader Styles */
.loader-container { 
    text-align: center; 
    padding: 40px 20px; 
    display: none;
}
.loader {
    border: 5px solid #fff; 
    border-top: 5px solid #000; 
    border-radius: 50%;
    width: 50px;
    height: 50px;
    animation: spin 1s linear infinite;
    margin: 0 auto 15px auto;
}
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
.loader-container p {
    color: #fff;
    font-size: 14px;
}

/* Confirm Modal */
.confirm-modal { 
    display:none; 
    position:fixed; 
    top:0; left:0; right:0; bottom:0; 
    background:rgba(255,255,255,0.2); 
    z-index:3000; 
    justify-content:center; 
    align-items:center; 
}
.confirm-content { 
    background:#000; 
    border-radius:15px; 
    padding:30px; 
    width:90%; 
    max-width:400px; 
    text-align:center; 
    border:2px solid #fff;
}
.confirm-content h3 { margin-bottom:20px; font-size:20px; color:#fff; }
.confirm-btns { display:flex; justify-content:space-around; gap:20px; }
.confirm-btn { 
    padding:12px 25px; 
    border:2px solid #fff; 
    border-radius:10px; 
    font-weight:600; 
    cursor:pointer; 
    font-size:16px; 
    transition:all 0.3s;
    outline: none;
}
.confirm-btn.cancel { background:#000; color:#fff; }
.confirm-btn.cancel:hover { background:#fff; color:#000; }
.confirm-btn.ok { background:#fff; color:#000; }
.confirm-btn.ok:hover { background:#000; color:#fff; }

/* Time separator */
.time-container span { color:#fff; }
</style>
</head>
<body>

<div class="container">
    <div class="header"><h1>সেনসোটিক ⏰ ঘন্টা</h1></div>
    <div class="alarm-list" id="alarmList">
        <div class="loader-container" id="loader">
            <div class="loader"></div>
            <p>ঘন্টা লোড হচ্ছে...</p>
        </div>
    </div>
</div>

<button class="add-button" onclick="openModal()">+</button>

<div class="modal" id="alarmModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">নতুন ঘন্টা</h2>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <form id="alarmForm">
            <div class="form-group">
                <label>সময়</label>
                <div class="time-container">
                    <input type="number" id="alarmHour" class="time-input" min="1" max="12" placeholder="h" required>
                    <span style="font-size:20px;">:</span>
                    <input type="number" id="alarmMinute" class="time-input" min="0" max="59" placeholder="m" required>
                    <select id="alarmAMPM" class="ampm-select">
                        <option value="AM">AM</option>
                        <option value="PM">PM</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>ঘন্টার নাম</label>
                <input type="text" id="alarmLabel" placeholder="ঘন্টার নাম লিখুন...">
            </div>
            <div class="form-group">
                <label>ঘন্টা কত সেকেন্ড বাজবে</label>
                <div class="duration-container">
                    <input type="number" id="alarmDuration" class="duration-input" min="1" max="300" placeholder="সেকেন্ড" value="5" required>
                    <span class="duration-label">সেকেন্ড</span>
                </div>
            </div>
            <div class="form-group">
                <label>রিপিট হবে (দিন নির্বাচন করুন)</label>
                <div class="days-selector">
                    <button type="button" class="day-btn" data-day="0">রবি</button>
                    <button type="button" class="day-btn" data-day="1">সোম</button>
                    <button type="button" class="day-btn" data-day="2">মঙ্গল</button>
                    <button type="button" class="day-btn" data-day="3">বুধ</button>
                    <button type="button" class="day-btn" data-day="4">বৃহঃ</button>
                    <button type="button" class="day-btn" data-day="5">শুক্র</button>
                    <button type="button" class="day-btn" data-day="6">শনি</button>
                </div>
            </div>
            <button type="submit" class="save-btn" id="saveBtn">সেভ করুন</button>
            <button type="button" class="delete-alarm-btn" id="deleteAlarmBtn" style="display:none;" onclick="deleteCurrentAlarm()">🗑️মুছে ফেলুন</button>
        </form>
    </div>
</div>

<div class="confirm-modal" id="confirmModal">
    <div class="confirm-content">
        <h3>আপনি কি এই ঘন্টা মুছে ফেলতে চান?</h3>
        <div class="confirm-btns">
            <button class="confirm-btn cancel" onclick="closeConfirm()">বাতিল</button>
            <button class="confirm-btn ok" id="confirmOkBtn">মুছে ফেলুন</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
// Firebase Config
const firebaseConfig = {
    apiKey: "AIzaSyBEjUf911-av1oV3dgr9IVXMNG8e25yLW0",
    authDomain: "monir-smart-control.firebaseapp.com",
    databaseURL: "https://monir-smart-control-default-rtdb.firebaseio.com",
    projectId: "monir-smart-control",
    storageBucket: "monir-smart-control.appspot.com",
    messagingSenderId: "435268128535",
    appId: "1:435268128535:web:2a5f665c10295b704e7152",
    measurementId: "G-496B19VT2C"
};
let database, alarmsRef, selectedDays=[], deleteKey=null, editingKey=null;
const loaderEl = document.getElementById('loader');
const alarmListEl = document.getElementById('alarmList');

try{
    firebase.initializeApp(firebaseConfig);
    database = firebase.database();
    alarmsRef = database.ref('alarms');
    loadAlarms();
}catch(err){
    console.error("Firebase সংযোগে ত্রুটি:", err);
    loaderEl.style.display = 'none';
    alarmListEl.innerHTML='<div class="empty-state"><p>ডেটাবেস সংযোগে ব্যর্থতা।</p></div>';
}

// Day buttons
document.querySelectorAll('.day-btn').forEach(btn=>{
    btn.addEventListener('click', function(){
        this.classList.toggle('selected');
        const day=parseInt(this.dataset.day);
        if(selectedDays.includes(day)) selectedDays=selectedDays.filter(d=>d!==day);
        else selectedDays.push(day);
    });
});

// Modals
function openModal(){ 
    editingKey = null;
    document.getElementById('modalTitle').textContent = 'নতুন ঘন্টা';
    document.getElementById('saveBtn').textContent = 'সেভ করুন';
    document.getElementById('deleteAlarmBtn').style.display = 'none';
    document.getElementById('alarmModal').classList.add('show'); 
    selectedDays=[]; 
    document.getElementById('alarmHour').value=''; 
    document.getElementById('alarmMinute').value=''; 
    document.getElementById('alarmAMPM').value='AM'; 
    document.getElementById('alarmLabel').value=''; 
    document.getElementById('alarmDuration').value='5';
    document.querySelectorAll('.day-btn').forEach(btn=>btn.classList.remove('selected')); 
}

function openEditModal(key, alarm){
    editingKey = key;
    document.getElementById('modalTitle').textContent = 'ঘন্টা এডিট করুন';
    document.getElementById('saveBtn').textContent = 'আপডেট করুন';
    document.getElementById('deleteAlarmBtn').style.display = 'block';
    document.getElementById('alarmModal').classList.add('show');
    
    // Parse time
    const timeParts = alarm.time.split(' ');
    const time = timeParts[0].split(':');
    const hour = parseInt(time[0]);
    const minute = parseInt(time[1]);
    const ampm = timeParts[1];
    
    document.getElementById('alarmHour').value = hour;
    document.getElementById('alarmMinute').value = minute;
    document.getElementById('alarmAMPM').value = ampm;
    document.getElementById('alarmLabel').value = alarm.label;
    document.getElementById('alarmDuration').value = alarm.duration || 5;
    
    selectedDays = alarm.days || [];
    document.querySelectorAll('.day-btn').forEach(btn=>{
        const day = parseInt(btn.dataset.day);
        if(selectedDays.includes(day)){
            btn.classList.add('selected');
        } else {
            btn.classList.remove('selected');
        }
    });
}

function closeModal(){ 
    document.getElementById('alarmModal').classList.remove('show'); 
    editingKey = null;
}

function openConfirm(key){ deleteKey=key; document.getElementById('confirmModal').style.display='flex'; }
function closeConfirm(){ deleteKey=null; document.getElementById('confirmModal').style.display='none'; }

function deleteCurrentAlarm(){
    if(editingKey){
        openConfirm(editingKey);
        closeModal();
    }
}

// Form Submit
document.getElementById('alarmForm').addEventListener('submit', function(e){
    e.preventDefault();
    let hour=parseInt(document.getElementById('alarmHour').value);
    let minute=parseInt(document.getElementById('alarmMinute').value);
    const ampm=document.getElementById('alarmAMPM').value;
    const duration=parseInt(document.getElementById('alarmDuration').value);
    
    if(isNaN(hour) || isNaN(minute) || hour<1 || hour>12 || minute<0 || minute>59){ 
        alert('সঠিক সময় দিন'); 
        return; 
    }
    
    if(isNaN(duration) || duration<1 || duration>300){ 
        alert('সঠিক সেকেন্ড দিন (১-৩০০)'); 
        return; 
    }
    
    const label=document.getElementById('alarmLabel').value || 'ঘন্টা';
    const time=`${hour.toString().padStart(2,'0')}:${minute.toString().padStart(2,'0')} ${ampm}`;
    const alarm={
        active: true,
        time: time,
        duration: duration,
        days: selectedDays.length>0 ? selectedDays : [0,1,2,3,4,5,6],
        label: label,
        timestamp: Date.now()
    };
    
    if(editingKey){
        updateAlarm(editingKey, alarm);
    } else {
        saveAlarm(alarm);
    }
});

function saveAlarm(alarm){
    if(!alarmsRef){ alert('Firebase সংযুক্ত নেই'); return; }
    alarmsRef.push(alarm).then(()=>closeModal()).catch(err=>alert(err.message));
}

function updateAlarm(key, alarm){
    if(!alarmsRef){ alert('Firebase সংযুক্ত নেই'); return; }
    alarmsRef.child(key).update(alarm).then(()=>closeModal()).catch(err=>alert(err.message));
}

function loadAlarms(){
    if(!alarmsRef) return;
    
    loaderEl.style.display = 'block';
    alarmListEl.innerHTML = ''; 
    alarmListEl.appendChild(loaderEl);

    alarmsRef.on('value', snapshot=>{
        loaderEl.style.display = 'none';
        const alarms=snapshot.val();
        displayAlarms(alarms);
    });
}

function displayAlarms(alarms){
    if(!alarms){
        alarmListEl.innerHTML='<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10" stroke-width="2"/><path d="M12 6v6l4 2" stroke-width="2" stroke-linecap="round"/></svg><p>কোনো ঘন্টা নেই</p></div>';
        return;
    }
    const dayNames=['রবি','সোম','মঙ্গল','বুধ','বৃহঃ','শুক্র','শনি'];
    alarmListEl.innerHTML=Object.entries(alarms).map(([key,alarm])=>{
        const daysText = alarm.days.length===7 ? 'প্রতিদিন' : alarm.days.map(d=>dayNames[d]).join(', ');
        const durationText = alarm.duration ? `${alarm.duration} সেকেন্ড বাজবে` : '';
        return `<div class="alarm-item ${alarm.active?'active':''}">
            <div class="alarm-info">
                <div class="alarm-time">${alarm.time}</div>
                <div class="alarm-days">${daysText}</div>
                <div class="alarm-label">${alarm.label}</div>
                ${durationText ? `<div class="alarm-duration">⏱️ ${durationText}</div>` : ''}
            </div>
            <div class="alarm-controls">
                <div class="toggle-switch ${alarm.active?'active':''}" onclick="toggleAlarm('${key}',${!alarm.active})"></div>
                <button class="edit-btn" onclick='openEditModal("${key}", ${JSON.stringify(alarm).replace(/'/g, "&apos;")})'></button>
            </div>
        </div>`;
    }).join('');
}

function toggleAlarm(key,active){ if(!alarmsRef) return; alarmsRef.child(key).update({active}); }

document.getElementById('confirmOkBtn').addEventListener('click', ()=>{
    if(deleteKey && alarmsRef){ 
        alarmsRef.child(deleteKey).remove(); 
        deleteKey=null; 
        closeConfirm(); 
    }
});

// Close modals on outside click
document.getElementById('alarmModal').addEventListener('click', e=>{ if(e.target===document.getElementById('alarmModal')) closeModal(); });
document.getElementById('confirmModal').addEventListener('click', e=>{ if(e.target===document.getElementById('confirmModal')) closeConfirm(); });
</script>
</body>
</html>
