<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>সেনসোটিক ⏰ ঘন্টা</title>
<style>
* { 
    margin:0; 
    padding:0; 
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
}
input, textarea, select {
    -webkit-user-select: text;
    user-select: text;
}
body { 
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    background:#000; 
    padding:20px; 
    min-height:100vh; 
    display: flex;
    flex-direction: column;
}
.container { max-width:600px; margin:0 auto; width: 100%; }
.header { text-align:center; color:#fff; margin-bottom:30px; padding-bottom:20px; border-bottom:2px solid #fff; }
.header h1 { font-size:28px; margin-bottom:5px; font-weight:600; }

.alarm-list { 
    background:#000; 
    border-radius:15px; 
    padding:15px; 
    margin-bottom:80px; 
    min-height:200px; 
    border:1px solid #fff; 
}
.alarm-item { 
    background:#000; 
    border-radius:15px; 
    padding:20px; 
    margin-bottom:15px; 
    display:flex; 
    justify-content:space-between; 
    align-items:center; 
    transition:all 0.3s ease; 
    border:2px solid #fff; 
}
.alarm-item:last-child { margin-bottom: 0; }

.alarm-info { flex:1; }
.alarm-time { font-size:36px; font-weight:bold; color:#fff; margin-bottom:8px; }
.alarm-days { font-size:14px; color:#fff; margin-bottom:5px; }
.alarm-label { font-size:12px; color:#fff; }
.alarm-duration { font-size:11px; color:#fff; opacity:0.8; margin-top:3px; }
.alarm-controls { display:flex; gap:10px; align-items:center; }

.toggle-switch { 
    position:relative; 
    width:50px; 
    height:26px; 
    background:#fff; 
    border-radius:13px; 
    cursor:pointer; 
    transition:background 0.3s;
    flex-shrink: 0;
}
.toggle-switch::after { 
    content:''; 
    position:absolute; 
    width:22px; 
    height:22px; 
    background:#000; 
    border-radius:50%; 
    top:2px; 
    left:2px; 
    transition:left 0.3s; 
}
.toggle-switch.active::after { left:26px; }

.edit-btn { 
    background:#000; 
    color:#fff; 
    border:2px solid #fff; 
    width:36px; 
    height:36px; 
    border-radius:8px; 
    cursor:pointer; 
    font-size:20px; 
    transition:all 0.3s; 
    display: flex; 
    align-items: center; 
    justify-content: center;
    flex-shrink: 0;
}
.edit-btn:hover { background:#fff; color:#000; }

.add-button { 
    position:fixed; 
    bottom:30px; 
    right:30px; 
    width:60px; 
    height:60px; 
    background:#fff; 
    border-radius:50%; 
    border:none; 
    color:#000; 
    font-size:32px; 
    cursor:pointer; 
    box-shadow:0 4px 15px rgba(255,255,255,0.3); 
    transition:all 0.3s; 
    z-index:1000; 
}
.add-button:hover { transform:scale(1.1); }

.modal { 
    display:none; 
    position:fixed; 
    top:0; left:0; right:0; bottom:0; 
    background:rgba(255,255,255,0.2); 
    z-index:2000; 
    padding:20px; 
    overflow-y:auto; 
    align-items:center; 
    justify-content:center; 
}
.modal.show { display:flex; }
.modal-content { 
    background:#000; 
    border-radius:20px; 
    padding:30px; 
    max-width:500px; 
    width:100%; 
    max-height:90vh; 
    overflow-y:auto; 
    border:2px solid #fff;
}
.modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; }
.modal-header h2 { font-size:24px; color:#fff; }
.close-btn { 
    background:none; 
    border:none; 
    font-size:28px; 
    cursor:pointer; 
    color:#fff;
}

.form-group { margin-bottom:20px; }
.form-group label { display:block; margin-bottom:8px; font-weight:600; color:#fff; }

.time-container { display:flex; gap:5px; align-items:center; justify-content:center; }
.time-input { 
    width:60px; 
    padding:10px; 
    border:2px solid #fff; 
    border-radius:8px; 
    font-size:20px; 
    text-align:center; 
    color:#fff; 
    font-weight:bold; 
    background:#000;
}
.time-input::placeholder { color:#fff; opacity:0.6; }
.ampm-select { 
    width:70px; 
    padding:10px; 
    border:2px solid #fff; 
    border-radius:8px; 
    font-size:18px; 
    font-weight:bold; 
    cursor:pointer; 
    background:#000;
    color:#fff;
}

.duration-container { display:flex; gap:10px; align-items:center; justify-content:center; }
.duration-input { 
    width:80px; 
    padding:10px; 
    border:2px solid #fff; 
    border-radius:8px; 
    font-size:18px; 
    text-align:center; 
    color:#fff; 
    font-weight:bold; 
    background:#000;
}
.duration-label { color:#fff; font-size:16px; font-weight:600; }

#alarmLabel { 
    width:100%; 
    padding:10px; 
    border:2px solid #fff; 
    border-radius:8px; 
    font-size:16px; 
    color:#fff; 
    font-weight:500; 
    background:#000;
}

.days-selector { 
    display:grid; 
    grid-template-columns:repeat(7,1fr); 
    gap:6px; 
}
.day-btn { 
    padding:10px 5px; 
    border:2px solid #fff; 
    background:#000; 
    border-radius:8px; 
    cursor:pointer; 
    font-size:11px; 
    font-weight:600; 
    color:#fff; 
    transition:all 0.3s; 
    width:100%;
}
.day-btn.selected { background:#fff; color:#000; }

.save-btn { 
    width:100%; 
    padding:15px; 
    background:#fff; 
    color:#000; 
    border:none; 
    border-radius:10px; 
    font-size:16px; 
    font-weight:600; 
    cursor:pointer; 
    margin-top:20px; 
    transition:all 0.3s;
}

.delete-alarm-btn {
    width:100%; 
    padding:15px; 
    background:#000; 
    color:#fff; 
    border:2px solid #fff; 
    border-radius:10px; 
    font-size:16px; 
    font-weight:600; 
    cursor:pointer; 
    margin-top:10px; 
    transition:all 0.3s;
}
.delete-alarm-btn:hover { background:#fff; color:#000; }

.empty-state { text-align:center; padding:40px 20px; color:#fff; }

.loader-container { text-align: center; padding: 40px 20px; display: none; }
.loader {
    border: 5px solid #fff; 
    border-top: 5px solid #000; 
    border-radius: 50%;
    width: 50px;
    height: 50px;
    animation: spin 1s linear infinite;
    margin: 0 auto 15px auto;
}
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
.loader-container p { color: #fff; font-size: 14px; }

.confirm-modal { 
    display:none; 
    position:fixed; 
    top:0; left:0; right:0; bottom:0; 
    background:rgba(255,255,255,0.2); 
    z-index:3000; 
    justify-content:center; 
    align-items:center; 
}
.confirm-content { 
    background:#000; 
    border-radius:15px; 
    padding:30px; 
    width:90%; 
    max-width:400px; 
    text-align:center; 
    border:2px solid #fff;
}
.confirm-content h3 { margin-bottom:20px; font-size:20px; color:#fff; }
.confirm-btns { display:flex; justify-content:space-around; gap:20px; }
.confirm-btn { 
    padding:12px 25px; 
    border:2px solid #fff; 
    border-radius:10px; 
    font-weight:600; 
    cursor:pointer; 
    font-size:16px; 
    transition:all 0.3s;
}
.confirm-btn.cancel { background:#000; color:#fff; }
.confirm-btn.cancel:hover { background:#fff; color:#000; }
.confirm-btn.ok { background:#fff; color:#000; }
.confirm-btn.ok:hover { background:#000; color:#fff; }

.time-container span { color:#fff; }
</style>
</head>
<body>

<div class="container">
    <div class="header"><h1>সেনসোটিক ⏰ ঘন্টা</h1></div>
    <div class="alarm-list" id="alarmList">
        <div class="loader-container" id="loader">
            <div class="loader"></div>
            <p>ঘন্টা লোড হচ্ছে...</p>
        </div>
    </div>
</div>

<button class="add-button" onclick="openModal()">+</button>

<div class="modal" id="alarmModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">নতুন ঘন্টা</h2>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <form id="alarmForm">
            <div class="form-group">
                <label>সময়</label>
                <div class="time-container">
                    <input type="number" id="alarmHour" class="time-input" min="1" max="12" placeholder="h" required>
                    <span>:</span>
                    <input type="number" id="alarmMinute" class="time-input" min="0" max="59" placeholder="m" required>
                    <select id="alarmAMPM" class="ampm-select">
                        <option value="AM">AM</option>
                        <option value="PM">PM</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>ঘন্টার নাম</label>
                <input type="text" id="alarmLabel" placeholder="ঘন্টার নাম লিখুন...">
            </div>
            <div class="form-group">
                <label>ঘন্টা কত সেকেন্ড বাজবে</label>
                <div class="duration-container">
                    <input type="number" id="alarmDuration" class="duration-input" min="1" max="300" placeholder="সেকেন্ড" value="5" required>
                    <span class="duration-label">সেকেন্ড</span>
                </div>
            </div>
            <div class="form-group">
                <label>রিপিট হবে (দিন নির্বাচন করুন)</label>
                <div class="days-selector" id="daysSelector">
                    <button type="button" class="day-btn" data-day="0">রবি</button>
                    <button type="button" class="day-btn" data-day="1">সোম</button>
                    <button type="button" class="day-btn" data-day="2">মঙ্গল</button>
                    <button type="button" class="day-btn" data-day="3">বুধ</button>
                    <button type="button" class="day-btn" data-day="4">বৃহঃ</button>
                    <button type="button" class="day-btn" data-day="5">শুক্র</button>
                    <button type="button" class="day-btn" data-day="6">শনি</button>
                </div>
            </div>
            <button type="submit" class="save-btn" id="saveBtn">সেভ করুন</button>
            <button type="button" class="delete-alarm-btn" id="deleteAlarmBtn" style="display:none;" onclick="deleteCurrentAlarm()">🗑️ মুছে ফেলুন</button>
        </form>
    </div>
</div>

<div class="confirm-modal" id="confirmModal">
    <div class="confirm-content">
        <h3>আপনি কি এই ঘন্টা মুছে ফেলতে চান?</h3>
        <div class="confirm-btns">
            <button class="confirm-btn cancel" onclick="closeConfirm()">বাতিল</button>
            <button class="confirm-btn ok" id="confirmOkBtn">মুছে ফেলুন</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
    apiKey: "AIzaSyBEjUf911-av1oV3dgr9IVXMNG8e25yLW0",
    authDomain: "monir-smart-control.firebaseapp.com",
    databaseURL: "https://monir-smart-control-default-rtdb.firebaseio.com",
    projectId: "monir-smart-control",
    storageBucket: "monir-smart-control.appspot.com",
    messagingSenderId: "435268128535",
    appId: "1:435268128535:web:2a5f665c10295b704e7152"
};

let database, alarmsRef, selectedDays = [], deleteKey = null, editingKey = null;
const loaderEl = document.getElementById('loader');
const alarmListEl = document.getElementById('alarmList');

try {
    firebase.initializeApp(firebaseConfig);
    database = firebase.database();
    alarmsRef = database.ref('alarms');
    loadAlarms();
} catch(err) {
    loaderEl.style.display = 'none';
    alarmListEl.innerHTML = '<div class="empty-state"><p>ডেটাবেস সংযোগে ব্যর্থতা।</p></div>';
}

document.querySelectorAll('.day-btn').forEach(btn => {
    btn.addEventListener('click', function(e) {
        e.preventDefault();
        this.classList.toggle('selected');
        const day = parseInt(this.dataset.day);
        if (selectedDays.includes(day)) {
            selectedDays = selectedDays.filter(d => d !== day);
        } else {
            selectedDays.push(day);
        }
    });
});

function openModal() { 
    editingKey = null;
    selectedDays = [];
    document.getElementById('modalTitle').textContent = 'নতুন ঘন্টা';
    document.getElementById('saveBtn').textContent = 'সেভ করুন';
    document.getElementById('deleteAlarmBtn').style.display = 'none';
    document.getElementById('alarmModal').classList.add('show'); 
    document.getElementById('alarmHour').value = ''; 
    document.getElementById('alarmMinute').value = ''; 
    document.getElementById('alarmAMPM').value = 'AM'; 
    document.getElementById('alarmLabel').value = ''; 
    document.getElementById('alarmDuration').value = '5';
    document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('selected')); 
}

function openEditModal(key, alarmData) {
    editingKey = key;
    selectedDays = [];
    
    document.getElementById('modalTitle').textContent = 'ঘন্টা এডিট করুন';
    document.getElementById('saveBtn').textContent = 'আপডেট করুন';
    document.getElementById('deleteAlarmBtn').style.display = 'block';
    document.getElementById('alarmModal').classList.add('show');
    
    const timeParts = alarmData.time.split(' ');
    const time = timeParts[0].split(':');
    
    document.getElementById('alarmHour').value = parseInt(time[0]);
    document.getElementById('alarmMinute').value = parseInt(time[1]);
    document.getElementById('alarmAMPM').value = timeParts[1];
    document.getElementById('alarmLabel').value = alarmData.label || '';
    document.getElementById('alarmDuration').value = alarmData.duration || 5;
    
    selectedDays = alarmData.days || [];
    document.querySelectorAll('.day-btn').forEach(btn => {
        if (selectedDays.includes(parseInt(btn.dataset.day))) {
            btn.classList.add('selected');
        } else {
            btn.classList.remove('selected');
        }
    });
}

function closeModal() { 
    document.getElementById('alarmModal').classList.remove('show'); 
    editingKey = null;
    selectedDays = [];
}

function openConfirm(key) { 
    deleteKey = key; 
    document.getElementById('confirmModal').style.display = 'flex'; 
}

function closeConfirm() { 
    deleteKey = null; 
    document.getElementById('confirmModal').style.display = 'none'; 
}

function deleteCurrentAlarm() {
    if (editingKey) {
        openConfirm(editingKey);
        closeModal();
    }
}

document.getElementById('alarmForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    let hour = parseInt(document.getElementById('alarmHour').value);
    let minute = parseInt(document.getElementById('alarmMinute').value);
    const ampm = document.getElementById('alarmAMPM').value;
    const duration = parseInt(document.getElementById('alarmDuration').value);
    
    if (isNaN(hour) || isNaN(minute) || hour < 1 || hour > 12 || minute < 0 || minute > 59) { 
        alert('সঠিক সময় দিন'); 
        return; 
    }
    
    if (isNaN(duration) || duration < 1 || duration > 300) { 
        alert('সঠিক সেকেন্ড দিন (১-৩০০)'); 
        return; 
    }
    
    const label = document.getElementById('alarmLabel').value;
    const time = `${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')} ${ampm}`;
    
    const alarm = {
        active: true,
        time: time,
        duration: duration,
        days: selectedDays.sort((a, b) => a - b),
        label: label,
        timestamp: Date.now()
    };
    
    if (editingKey) {
        alarmsRef.child(editingKey).update(alarm).then(() => closeModal());
    } else {
        alarmsRef.push(alarm).then(() => closeModal());
    }
});

function loadAlarms() {
    loaderEl.style.display = 'block';
    alarmListEl.innerHTML = ''; 
    alarmListEl.appendChild(loaderEl);

    alarmsRef.on('value', snapshot => {
        loaderEl.style.display = 'none';
        displayAlarms(snapshot.val());
    });
}

function displayAlarms(alarms) {
    if (!alarms) {
        alarmListEl.innerHTML = '<div class="empty-state"><p>কোনো ঘন্টা নেই</p></div>';
        return;
    }
    
    const dayNames = ['রবি', 'সোম', 'মঙ্গল', 'বুধ', 'বৃহঃ', 'শুক্র', 'শনি'];
    
    alarmListEl.innerHTML = Object.entries(alarms).map(([key, alarm]) => {
        const days = alarm.days && alarm.days.length > 0 
            ? alarm.days.map(d => dayNames[d]).join(', ') 
            : 'কোন দিন নয়';
        
        return `
            <div class="alarm-item">
                <div class="alarm-info">
                    <div class="alarm-time">${alarm.time}</div>
                    <div class="alarm-days">${days}</div>
                    ${alarm.label ? `<div class="alarm-label">${alarm.label}</div>` : ''}
                    <div class="alarm-duration">${alarm.duration} সেকেন্ড</div>
                </div>
                <div class="alarm-controls">
                    <div class="toggle-switch ${alarm.active ? 'active' : ''}" onclick="toggleAlarm('${key}', ${!alarm.active})"></div>
                    <button class="edit-btn" onclick='openEditModal("${key}", ${JSON.stringify(alarm).replace(/'/g, "\\'")})''>⚙</button>
                </div>
            </div>
        `;
    }).join('');
}

function toggleAlarm(key, active) {
    alarmsRef.child(key).update({ active: active });
}

document.getElementById('confirmOkBtn').addEventListener('click', function() {
    if (deleteKey) {
        alarmsRef.child(deleteKey).remove().then(() => closeConfirm());
    }
});
</script>
</body>
</html>
