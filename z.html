<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ESP8266 Smart Control</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial, Helvetica, sans-serif;
  background:#555;
  color:white;
  transition:.3s;
}

.panel{
  background:rgba(0,0,0,.4);
  padding:28px;
  border-radius:20px;
  width:90%;
  max-width:360px;
  box-shadow:0 10px 25px rgba(0,0,0,.4);
}

h3{
  text-align:center;
  margin-bottom:25px;
  font-size:22px;
}

.device{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:22px 0;
  font-size:20px;
}

/* ===== BIG TOGGLE ===== */
.switch{
  position:relative;
  width:90px;
  height:48px;
}

.switch input{
  display:none;
}

.slider{
  position:absolute;
  inset:0;
  background:#999;
  border-radius:50px;
  transition:.3s;
}

.slider:before{
  content:"";
  position:absolute;
  width:38px;
  height:38px;
  left:5px;
  top:5px;
  background:white;
  border-radius:50%;
  transition:.3s;
  box-shadow:0 2px 6px rgba(0,0,0,.4);
}

input:checked + .slider{
  background:#00e676;
}

input:checked + .slider:before{
  transform:translateX(42px);
}

input:disabled + .slider{
  opacity:.5;
}
</style>
</head>

<body>

<div class="panel">
  <h3 id="status">Checking ESP...</h3>

  <div class="device">
    <span>💡 D1 Light</span>
    <label class="switch">
      <input type="checkbox" id="d1" disabled>
      <span class="slider"></span>
    </label>
  </div>

  <div class="device">
    <span>💡 D2 Light</span>
    <label class="switch">
      <input type="checkbox" id="d2" disabled>
      <span class="slider"></span>
    </label>
  </div>
</div>

<script>
const client = mqtt.connect(
  "wss://ce071fa01d034227b2fbc0fb1902e00f.s1.eu.hivemq.cloud:8884/mqtt",
  {
    username:"senso",
    password:"b!sXjDd9LrE8D.r",
    clientId:"web_" + Math.random().toString(16).slice(2)
  }
);

const d1 = document.getElementById("d1");
const d2 = document.getElementById("d2");
const statusTxt = document.getElementById("status");

let online = false;

client.on("connect",()=>{
  client.subscribe("device/esp8266_01/pong");
  client.publish("device/esp8266_01/ping","status");

  setTimeout(()=>{
    if(!online){
      document.body.style.background="#c62828";
      statusTxt.innerText="ESP OFFLINE";
    }
  },2000);
});

client.on("message",(topic,msg)=>{
  if(topic==="device/esp8266_01/pong"){
    const data = JSON.parse(msg.toString());

    online = true;
    document.body.style.background="#2e7d32";
    statusTxt.innerText="ESP ONLINE";

    d1.checked = data.d1 === 1;
    d2.checked = data.d2 === 1;

    d1.disabled = false;
    d2.disabled = false;
  }
});

d1.onchange = ()=>{
  if(online) client.publish("device/esp8266_01/light/d1", d1.checked?"ON":"OFF");
};

d2.onchange = ()=>{
  if(online) client.publish("device/esp8266_01/light/d2", d2.checked?"ON":"OFF");
};
</script>

</body>
</html>
